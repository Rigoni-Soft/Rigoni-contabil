name: CI

on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop, homolog, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Lint, naming, deps, types, format, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # check:design-doc compara com a base da PR (git diff base...HEAD).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn check:naming
      - run: yarn check:refs
      - run: yarn check:specs
      - run: yarn check:design-doc ${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: yarn check:deps
      - run: yarn check:guard-senha

      - name: Gera os tipos ambient do Next.js (LayoutProps etc.) antes do typecheck
        run: yarn next typegen

      - run: yarn tsc --noEmit
      - run: yarn format:check
      - run: yarn test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # env.ts só exige formato válido (URL + chave não vazia) pra passar no Zod;
      # `next build` não precisa de um Supabase real de pé, só compilar.
      - name: Build de produção
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-key

  integracao:
    name: Integração (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sobe o Supabase local (migrations + seed)
        run: supabase start

      - name: Exporta URL e chave do Supabase local pro ambiente do job
        # `supabase status -o env` sai como KEY="valor" (aspas literais), que o
        # $GITHUB_ENV não remove — a URL vira "http://..." com aspas incluídas
        # e o createClient rejeita como inválida. `-o json` + jq evita isso.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - run: yarn test:int

      - name: Encerra o Supabase local
        if: always()
        run: supabase stop

  # Quanto de E2E esta execução roda (docs/testes.md, seção 5). A integração acima roda sempre: custa
  # menos de 1 min. O E2E é o que pesa (serial, `next dev`), então escolhe o tamanho pelo evento:
  #   completo: merge na develop ou na homolog, e PR para a homolog (a promoção);
  #   rápido:   PR para a develop (arquivos e2e do diff + @smoke);
  #   nenhum:   PR e merge na main, que recebe código que já passou no completo da homolog.
  plano-e2e:
    name: Plano do E2E
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      modo: ${{ steps.plano.outputs.modo }}
      shards: ${{ steps.plano.outputs.shards }}
    steps:
      - id: plano
        env:
          EVENTO: ${{ github.event_name }}
          RAMO: ${{ github.ref_name }}
          BASE: ${{ github.base_ref }}
        run: |
          MODO=nenhum
          if [ "$EVENTO" = push ] && { [ "$RAMO" = develop ] || [ "$RAMO" = homolog ]; }; then MODO=completo; fi
          if [ "$EVENTO" = pull_request ] && [ "$BASE" = homolog ]; then MODO=completo; fi
          if [ "$EVENTO" = pull_request ] && [ "$BASE" = develop ]; then MODO=rapido; fi
          if [ "$MODO" = completo ]; then SHARDS='["1/3","2/3","3/3"]'; else SHARDS='["1/1"]'; fi
          echo "modo=$MODO shards=$SHARDS"
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E ${{ needs.plano-e2e.outputs.modo }} (${{ matrix.shard }})
    needs: plano-e2e
    if: needs.plano-e2e.outputs.modo != 'nenhum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plano-e2e.outputs.shards) }}
    steps:
      # Histórico completo: `--only-changed` compara com a base da PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Cada shard sobe o seu Supabase: os testes batem no mesmo banco e não rodam em paralelo nele.
      - name: Sobe o Supabase local (migrations + seed)
        run: supabase start

      - name: Exporta URL e chave do Supabase local pro ambiente do job
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Instala os browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E completo (este shard)
        if: needs.plano-e2e.outputs.modo == 'completo'
        run: yarn test:e2e --shard=${{ matrix.shard }}

      # Rápido: o @smoke inteiro, e dos arquivos e2e do diff só o que não é @smoke (sem repetir teste).
      # Sem arquivo e2e no diff, o segundo passo não acha nada e não falha.
      - name: E2E rápido, @smoke
        if: needs.plano-e2e.outputs.modo == 'rapido'
        run: yarn test:e2e --grep @smoke

      - name: Reseta o Supabase local (migrations + seed) entre os passos
        if: needs.plano-e2e.outputs.modo == 'rapido'
        run: |
          supabase db reset
          # O reset devolve o controle antes do PostgREST reconectar ("Database client error"): espera ele responder.
          for i in $(seq 1 30); do
            curl -sf --max-time 5 -o /dev/null -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/avisos_cadastro?select=id&limit=1" && exit 0
            sleep 2
          done
          echo "PostgREST não voltou após o reset" && exit 1

      - name: E2E rápido, arquivos e2e do diff
        if: needs.plano-e2e.outputs.modo == 'rapido'
        run: yarn test:e2e --only-changed=origin/${{ github.base_ref }} --grep-invert @smoke --pass-with-no-tests

      - name: Guarda trace e capturas das falhas do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore

      - name: Encerra o Supabase local
        if: always()
        run: supabase stop
